name: Triển khai lên GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn repository
        uses: actions/checkout@v4

      - name: Chuẩn bị gói triển khai sạch
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js assets data _site/

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: Tải artifact lên GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Triển khai lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
